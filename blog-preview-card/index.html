<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main>
    <article class="card">
      <img class="card-img" src="./assets/images/illustration-article.svg" alt="Colorful illustration representing HTML and CSS coding"/>
      <div class="card-content">
        <p><span class="card-label type-caption-strong" role="text">Learning</span></p>

        <p class="type-caption">
          <time datetime="2023-12-21">Published 21 Dec 2023</time>
        </p>

        <h1 class="type-display">HTML & CSS foundations</h1>

        <p class="type-body">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>
      <address class="author">
        <img src="./assets/images/image-avatar.webp" alt="Greg Hooper's profile picture" height="32" width="32"/>
        <span class="type-caption-strong">Greg Hooper</span>
      </address>
    </article>
  </main>

  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>. 
    Coded by <a href="https://www.linkedin.com/in/ahmed-mahfoudhi" target="_blank" rel="noopener noreferrer">Ahmed Mahfoudhi</a>.
  </footer>
</body>
</html>
